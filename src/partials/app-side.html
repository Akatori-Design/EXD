      <!-- Log out confirmation (Figma 876-15390) -->
      <dialog class="logout" id="logout" aria-labelledby="logout-title" aria-describedby="logout-desc">
        <span class="logout__ico" aria-hidden="true"><svg viewBox="0 0 20 20"><path d="M8 4H4.5v12H8M12.5 6.6L16 10l-3.5 3.4M16 10H8" /></svg></span>
        <h2 id="logout-title">Log out of EXD?</h2>
        <p id="logout-desc">You'll need to sign in again to manage your releases and earnings.</p>
        <button class="modal__x logout__x" type="button" data-close aria-label="Close"><svg viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg></button>
        <div class="logout__actions">
          <button class="ghost" type="button" data-close>Cancel</button>
          <a class="solid" href="/login.html" data-confirm-logout>Log Out</a>
        </div>
      </dialog>
      <script>
        // Log Out asks first; confirming goes to Log in.
        (() => {
          const dlg = document.getElementById('logout');
          document.querySelector('[data-logout]').addEventListener('click', (e) => {
            e.preventDefault();
            dlg.showModal();
          });
          dlg.addEventListener('click', (e) => {
            if (e.target === dlg || e.target.closest('[data-close]')) dlg.close();
          });
        })();
      </script>
      <script>
        // mark the current section (each page sets data-view on <body>)
        document.querySelector(`.side [data-nav="${document.body.dataset.view}"]`)?.setAttribute('aria-current', 'page');
      </script>
