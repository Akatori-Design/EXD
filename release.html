    <title>Release Music — EXD</title>
    <!--@include head-->
    <link rel="stylesheet" href="/src/app.css" />

  <body data-view="release">
    <script>
      // Release Music always starts at the upload step (Figma 582-22501).

        location.replace('/release-flow.html');
